<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list</title>
</head>
<body>
    <h1>HTML Lists</h1>

<h2>Unordered List</h2>
<ul>
    <li>Apples</li>
    <li>Bananas</li>
    <li>Cherries</li>
</ul>

<h2>Ordered List</h2>
<ol>
    <li>Wake up</li>
    <li>Brush teeth</li>
    <li>Have breakfast</li>
</ol>

<h2>Menu</h2>
<menu>
    <li>New</li>
    <li>Open</li>
    <li>Save</li>
</menu>
</body>
</html>
