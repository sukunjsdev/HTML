<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM</title>
</head>

<body>
    <div>
        <h1>All Input Types Form</h1>
    </div>
    <div>
        <form>
            <label>Text</label>
            <input type="text" placeholder="Enter text">
            <br><label>Password</label>
            <input type="password" placeholder="Enter password">
            <br><label>Email</label>
            <input type="email" placeholder="Enter email">
            <br><label>Number</label>
            <input type="number" placeholder="Enter number">
            <br><label>Date</label>
            <input type="date">
            <br><label>Time</label>
            <input type="time">
            <br><label>DateTime Local</label>
            <input type="datetime-local">
            <br><label>Month</label>
            <input type="month">
            <br><label>Week</label>
            <input type="week">
            <br><label>Color Picker</label>
            <input type="color">
            <br><label>Range Slider</label>
            <input type="range">
            <br><label>URL</label>
            <input type="url" placeholder="Enter website URL">
            <br><label>Phone Number</label>
            <input type="tel" placeholder="Enter phone number">
            <br><label>Search</label>
            <input type="search" placeholder="search">
            <br><label>Gender(Radio Buttons)</label>
            <input type="radio" name="gender" id="male">
            <label>Male</label>
            <input type="radio" name="gender" id="female">
            <label>Female</label>
            <br><label>Skills(Checkboves)</label>
            <input type="checkbox" id="html" name="skills">
            <label for="html">HTML</label>
            <input type="checkbox" id="css" name="skills">
            <label for="css">CSS</label>
            <input type="checkbox" id="js" name="skills">
            <label for="js">JS</label>
            <br><label>Select State</label>
            <select>
                <option>Andhra Pradesh</option>
                <option>Arunachal Pardesh</option>
                <option>Assam</option>
                <option>Bihar</option>
                <option>Chhattisgarh</option>
                <option>Goa</option>
                <option>Gujarat</option>
                <option>Haryana</option>
                <option>Himachal Pradesh</option>
                <option>Jharkhand</option>
                <option>Karnataka</option>
                <option>Kerala</option>
                <option>Madhya Pradesh</option>
                <option>Maharashtra</option>
                <option>Manipur</option>
                <option>Meghalaya</option>
                <option>Mizoram</option>
                <option>Nagaland</option>
                <option>Odisha</option>
                <option>Panjab</option>
                <option>Rajasthan</option>
                <option>Sikkim</option>
                <option>Tamil Nadu</option>
                <option>Telangana</option>
                <option>Tripura</option>
                <option>Uttar Pradesh</option>
                <option>Uttarakhand</option>
                <option>West Bengal</option>
            </select>
            <br><label>Message</label>
            <textarea cols="30" rows="5" placeholder="Enter your message"></textarea>
            <br><button type="submit">Submit</button>
            <button type="reset">Reset</button>
            <br><label>File Upload</label>
            <input type="file">
        </form>
    </div>


</body>

</html>
