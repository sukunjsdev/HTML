<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list</title>
</head>

<body>
    <div>
        <h1>HTML List</h1>
    </div>
    <div>
        <ol>
            <h2>
                <li>unorder list</li>
            </h2>
            <ul>
                <li>Apples</li>
                <li>Bannanas</li>
                <li>Cherries</li>
            </ul>
            <h2>
                <li>Ordered list</li>
            </h2>
            <ol>
                <li>Wake up</li>
                <li>Brush teeth</li>
                <li>Have breakfast</li>
            </ol>
            <h2>
                <li>Menu</li>
            </h2>
            <menu>
                <li>New</li>
                <li>Open</li>
                <li>Save</li>
            </menu>
        </ol>
    </div>

</body>

</html>
